@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131c;--fg:#ece8f5;--btn:#ece8f5;--btnfg:#14131c}}
:root[data-theme="dark"]{--bg:#14131c;--fg:#ece8f5;--btn:#ece8f5;--btnfg:#14131c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
h1{font-size:14px;margin:0;font-weight:400}
canvas{width:100%;max-width:960px;aspect-ratio:320/192;image-rendering:pixelated;border:4px solid var(--fg);background:#000;touch-action:none}
.row{display:flex;gap:10px;width:100%;max-width:960px;flex-wrap:wrap}
.row button{font:inherit;font-size:9px;padding:10px 14px;background:var(--btn);color:var(--btnfg);border:0}
#seed{font:inherit;font-size:10px;padding:10px;flex:1;min-width:120px;background:transparent;color:var(--fg);border:3px solid var(--fg)}
.row button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
p{font-size:9px;line-height:1.8;margin:0;max-width:640px;text-align:center}
.stage{position:relative;width:100%;max-width:960px}
.menu{position:absolute;inset:4px;display:flex;overflow:auto;background:linear-gradient(180deg,rgba(23,18,51,.82),rgba(23,18,51,.45));color:#fff4d6}
.menu.sub{background:linear-gradient(rgba(23,18,51,.55),rgba(23,18,51,.55)),var(--tex);background-size:auto,128px 128px;image-rendering:pixelated}
.menu[hidden],.menu section[hidden]{display:none}
.menu section{display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.8vw,13px);width:min(80%,360px);margin:auto;padding:8px 0}
.menu h2{font-size:clamp(10px,2.4vw,16px);margin:0 0 4px;font-weight:400;color:#ffd23f;text-shadow:2px 2px 0 #e63946}
.menu p{font-size:clamp(7px,1.5vw,10px);line-height:1.9;margin:0;max-width:none;text-align:center}
.menu p.about{text-align:left;width:100%}
.menu p.tag{font-size:clamp(6px,1.3vw,9px);margin:0 0 4px;color:#b9b0f0}
.logo{font-size:clamp(20px,6.5vw,46px);line-height:1.2;text-align:center;color:#ffd23f;letter-spacing:1px;text-shadow:3px 3px 0 #e63946,6px 6px 0 #1d1b2a}
.logo b{display:inline-block;margin-top:8px;padding:2px 10px;font-weight:400;background:#e63946;color:#fff4d6;text-shadow:3px 3px 0 #1d1b2a;transform:rotate(-3deg)}
.mb{font:inherit;font-size:clamp(8px,1.9vw,13px);width:100%;padding:clamp(8px,1.7vw,12px) 6px;color:#1d1b2a;background:#fff4d6;border:3px solid #1d1b2a;box-shadow:4px 4px 0 #e63946;cursor:pointer}
.mb:hover,.mb:focus-visible{background:#ffd23f;transform:translate(2px,2px);box-shadow:2px 2px 0 #e63946}
.mb:hover::before,.mb:focus-visible::before{content:'> '}
.mb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.menu input{font:inherit;font-size:clamp(8px,1.7vw,12px);width:100%;box-sizing:border-box;padding:10px;background:#1d1b2a;color:#fff4d6;border:3px solid #b9b0f0;text-align:center}
.menu input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.board{width:100%;display:flex;flex-direction:column;gap:3px;font-size:clamp(6px,1.35vw,9px)}
.board p{text-align:center}
.brow{display:grid;grid-template-columns:2.4em 1fr auto auto;gap:8px;padding:4px 6px;background:rgba(0,0,0,.35);border-left:3px solid #b9b0f0;text-align:left}
.brow:first-child{border-left-color:#ffd23f;color:#ffd23f}
.brow .s{text-align:right}
.menu p.ver{font-size:clamp(6px,1.2vw,8px);color:#b9b0f0;margin:6px 0 0}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.row button,.mb,.tmini button{touch-action:manipulation}
.mhint{display:none}
body.touch-on .khint{display:none}
body.touch-on .mhint{display:block}
@media (pointer:coarse){.khint{display:none}.mhint{display:block}}
/* controles de toque: direção deslizante à esquerda, PULAR e ATACAR à direita */
.touch{display:none;position:relative;width:100%;max-width:960px;height:calc(clamp(150px,30vh,230px) * var(--sz,1));touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--j:calc(clamp(80px,22vw,104px) * var(--sz,1))}
body.touch-on .touch{display:block}
@media (pointer:coarse){.touch{display:block}}
body.in-menu .touch{display:none!important}
.tmini{position:absolute;top:0;right:0;display:flex;gap:6px;z-index:2}
.tmini button{font:inherit;font-size:9px;padding:10px 12px;background:#1d1b2a;color:#fff4d6;border:2px solid #fff4d6}
#stick{position:absolute;left:0;bottom:0;width:52%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
#stickBase{position:relative;width:min(calc(176px * var(--sz,1)),92%);height:calc(72px * var(--sz,1));box-sizing:border-box;border-radius:36px;background:rgba(23,18,51,.6);border:3px solid #fff4d6;box-shadow:4px 4px 0 #e63946;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:#fff4d6;font-size:14px;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffd23f;border:3px solid #1d1b2a}
#btns{position:absolute;right:0;bottom:0;width:48%;height:100%}
#btns button{position:absolute;border-radius:50%;font:inherit;font-size:10px;padding:0;color:#1d1b2a;border:3px solid #1d1b2a;box-shadow:4px 4px 0 #e63946;touch-action:none;user-select:none;-webkit-user-select:none}
#bj{right:8px;bottom:10px;width:var(--j);height:var(--j);background:#ffd23f}
#ba{right:calc(var(--j) + 16px);bottom:calc(var(--j) * .45);width:calc(var(--j) * .8);height:calc(var(--j) * .8);background:#fff4d6}
#btns button.on{transform:translate(2px,2px);box-shadow:2px 2px 0 #e63946;filter:brightness(.9)}
/* celular: menu ocupa a tela toda */
@media (max-width:700px){
  body{padding:8px;gap:10px}
  canvas{border-width:3px}
  .menu{position:fixed;inset:0;z-index:20}
}
@media (max-height:540px){
  .logo{font-size:clamp(18px,9vh,34px)}
  .mb{padding:clamp(6px,2.2vh,10px) 6px;font-size:clamp(8px,3.2vh,12px)}
  .menu section{gap:clamp(5px,1.6vh,9px)}
}
/* celular deitado: jogo ocupa a altura toda e os controles ficam por cima, nos cantos */
@media (orientation:landscape) and (max-height:540px) and (pointer:coarse){
  body{padding:0;gap:0;justify-content:center;min-height:100vh;min-height:100dvh}
  .stage{width:auto;max-width:100vw}
  canvas{height:100vh;height:100dvh;width:auto;max-width:100vw;border:0}
  .row,.khint,.mhint{display:none}
  .touch{position:fixed;left:0;right:0;bottom:0;max-width:none;height:calc(min(52vh,210px) * var(--sz,1));pointer-events:none;--j:calc(clamp(72px,26vh,100px) * var(--sz,1));padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  #stick,#btns{pointer-events:auto}
  #stick{left:env(safe-area-inset-left,0px);width:40%}
  #stickBase{background:rgba(23,18,51,.45)}
  #btns{width:40%;right:env(safe-area-inset-right,0px)}
  .tmini{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));pointer-events:auto}
}
/* tela de início da produtora */
.intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#2b2062 0,#171233 68%);color:#fff4d6;transition:opacity .35s}
.intro[hidden]{display:none}
.intro.out{opacity:0;pointer-events:none}
.intro-in{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.4vmin,18px);text-align:center}
.eclogo{width:clamp(72px,24vmin,160px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:ecflip 1.7s ease-in-out .2s both}
.ecname{font-size:clamp(24px,8vmin,58px);letter-spacing:1px;text-shadow:3px 3px 0 #e63946,6px 6px 0 #0d0a24;animation:ecfade .8s ease-out 1.1s both}
.ecsub{font-size:clamp(9px,2.6vmin,18px);letter-spacing:.5em;margin-right:-.5em;color:#ffd23f;animation:ecfade .8s ease-out 1.4s both}
.ecskip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));margin:0;font-size:clamp(6px,1.6vmin,9px);color:#b9b0f0;animation:ecfade .8s ease-out 2s both,ecblink 1.2s ease-in-out 2.8s infinite}
@keyframes ecflip{0%{transform:translateY(-40px) scaleX(1);opacity:0}15%{transform:translateY(0) scaleX(1);opacity:1}35%{transform:scaleX(.06)}50%{transform:scaleX(-1)}65%{transform:scaleX(.06)}85%,100%{transform:scaleX(1)}}
@keyframes ecfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ecblink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.intro *{animation:none!important}}
/* controles de toque: transparência, tamanho, estilo e mão */
#stickBase,#btns button,.tmini button{opacity:var(--ctl-op,1)}
body.pad-arrows #stickBase{background:none;border:0;box-shadow:none;padding:0;gap:12px;border-radius:0;width:min(calc(210px * var(--sz,1)),96%);height:calc(84px * var(--sz,1))}
body.pad-arrows #stickBase span{flex:1;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(22px * var(--sz,1));background:#fff4d6;color:#1d1b2a;border:3px solid #1d1b2a;border-radius:18px;box-shadow:4px 4px 0 #e63946}
body.pad-arrows #stickBase.l .sl,body.pad-arrows #stickBase.r .sr{background:#ffd23f;transform:translate(2px,2px);box-shadow:2px 2px 0 #e63946}
body.pad-arrows #knob{display:none}
body.lefty #stick{left:auto;right:0}
body.lefty #btns{right:auto;left:0}
body.lefty #bj{right:auto;left:8px}
body.lefty #ba{right:auto;left:calc(var(--j) + 16px)}
@media (orientation:landscape) and (max-height:540px) and (pointer:coarse){
  body.lefty #stick{left:auto;right:env(safe-area-inset-right,0px)}
  body.lefty #btns{right:auto;left:env(safe-area-inset-left,0px)}
}
body.in-controls .touch{z-index:25}
.menu.ctl section{margin:6px auto auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.6vw,10px);width:100%}
.menu .grid2 .mb{font-size:clamp(7px,1.6vw,11px)}
</style>

      <button class="mb" data-a="back" data-i="back">VOLTAR</button>
    </section>
    <section data-s="options" hidden>
      <h2 data-i="options">OPÇÕES</h2>
      <button class="mb" data-a="music" id="btnMusic"></button>
      <button class="mb" data-a="sfx" id="btnSfx"></button>
      <button class="mb" data-a="vibe" id="btnVib"></button>
      <button class="mb" data-a="lang" id="btnLang"></button>

    <section data-s="controls" hidden>
      <h2 data-i="controls">CONTROLES</h2>
      <div class="grid2">
        <button class="mb" data-a="cstyle" id="btnStyle"></button>
        <button class="mb" data-a="chand" id="btnHand"></button>
        <button class="mb" data-a="csize" id="btnSize"></button>
        <button class="mb" data-a="cop" id="btnOp"></button>
      </div>
      <p data-i="ctltest">Teste os controles aqui embaixo.</p>
      <button class="mb" data-a="options" data-i="back">VOLTAR</button>
    </section>
    <section data-s="about" hidden>
      <h2 data-i="about">SOBRE</h2>
      <p class="about" data-i="a1"></p>
      <p class="about" data-i="a2"></p>
      <p class="about" data-i="a3"></p>
      <p class="about" data-i="a4"></p>
      <button class="mb" data-a="back" data-i="back">VOLTAR</button>
    </section>
  </div>
  <div id="intro" class="intro" aria-label="edualC gaming">
    <div class="intro-in">
      <svg id="ecLogo" class="eclogo" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"></svg>
      <div class="ecname">edualC</div>
      <div class="ecsub">GAMING</div>
    </div>
    <p class="ecskip" data-i="skip">toque ou aperte uma tecla</p>
  </div>
</div>
<div class="touch" id="touch" aria-label="Controles de toque" data-al="al_touch">
  <div class="tmini">
    <button id="tpause" aria-label="Pausar" data-al="al_pause">II</button>

</div>
<div class="row">

<p class="khint" data-i="khint"></p>
<p class="mhint" data-i="mhint"></p>

// ---------- MUNDO INFINITO (estilo Minecraft: semente + ruído, gerado em pedaços) ----------
function hashSeed(s) {                           // texto -> número, como o Minecraft faz com a semente
  let h = 2166136261;
  for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return h >>> 0;
}
function rng(a) {                                // gerador pseudoaleatório: mesma semente = mesma sequência
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeNoise(r) {                          // ruído de valor 1D com 3 oitavas: colinas grandes + detalhes
  const v = Array.from({length: 256}, () => r());
  const n = x => { const i = Math.floor(x), f = x - i, u = f*f*(3 - 2*f); return v[i & 255]*(1-u) + v[(i+1) & 255]*u; };
  return x => n(x)*0.6 + n(x*2.3 + 57)*0.3 + n(x*5.1 + 131)*0.1;
}

let map, gy, hole, bio, segs, spikes, coins, enemies, decor, pops, items = [], airJumps = 0;     // gy[x] = linha da superfície; bio[x] = bioma
let rnd, rne, noise, rb, seedText = '', level = 1;
let terrX = 0, entX = 0, gapLeft = 0, lastGap = 0, platNext = 10, trailNext = 8, batNext = 20, decNext = 2;
let camX = 0, panX = 0;

// O bioma muda a cada 110 a 200 colunas, sorteado pela semente e nunca repetindo o anterior.
function biomeAt(x) {
  while (!segs.length || segs[segs.length-1].end <= x) {
    const start = segs.length ? segs[segs.length-1].end : 0;
    let id; do { id = Math.floor(rb() * 4); } while (segs.length && id === segs[segs.length-1].id);
    segs.push({start, end: start + 110 + Math.floor(rb() * 90), id});
  }
  for (let i = segs.length - 1; i >= 0; i--) if (segs[i].start <= x) return segs[i].id;
}

function newWorld(seed, lv) {
  seedText = String(seed); level = lv;
  const h = hashSeed(seedText);
  rnd = rng(h); noise = makeNoise(rnd); rb = rng(h ^ 0x9E3779B9); rne = rng(h ^ 0x85EBCA6B);
  map = Array.from({length: H}, () => []);
  gy = []; hole = []; bio = []; segs = [];
  spikes = []; coins = []; enemies = []; decor = []; pops = []; items = [];
  terrX = entX = 0; gapLeft = 0; lastGap = 0; platNext = 10; trailNext = 8; batNext = 20; decNext = 2;
  camX = panX = 0; lastBiome = -1;
  ensure(40);
}

// Gera o chão de um pedaço [x0, x1): relevo vindo do ruído, degraus limitados e buracos de 2 a 3 colunas.
function genTerrain(x0, x1) {
  for (let x = x0; x < x1; x++) {
    bio[x] = biomeAt(x);
    if (gapLeft > 0) { gapLeft--; hole[x] = true; gy[x] = gy[x-1]; continue; }
    hole[x] = false;
    if (x > 12 && x - lastGap > 14 && rnd() < 0.1 + Math.min(0.05, x / 8000)) {
      gapLeft = 1 + (rnd() < 0.5 ? 1 : 0); lastGap = x + gapLeft; hole[x] = true; gy[x] = gy[x-1]; continue;
    }
    const n = Math.max(0, Math.min(0.999, (noise(x / 12) - 0.5) * 2 + 0.5));
    let t = 10 - Math.floor(n * 4);                         // linhas 7 a 10
    if (x < 6) t = 10;                                      // começo plano
    if (x > 0) t = Math.max(gy[x-1] - 1, Math.min(gy[x-1] + 2, t));
    gy[x] = t;
    for (let y = t; y < H; y++) map[y][x] = 1;
  }
}

// Coloca obstáculos, plataformas, moedas, inimigos e enfeites no pedaço [x0, x1).
function genEntities(x0, x1) {
  const flat = x => !hole[x-1] && !hole[x] && !hole[x+1] && gy[x-1] === gy[x] && gy[x] === gy[x+1];
  const nearHole = (x, d) => { for (let i = x - d; i <= x + d; i++) if (hole[i]) return true; return false; };
  const L = Math.floor(camX / T) * T - 15 * T;              // descarta o que já ficou para trás
  spikes = spikes.filter(s => s.x > L); coins = coins.filter(c => c.x > L);
  enemies = enemies.filter(e => e.x > L - 40); decor = decor.filter(d => d.x > L);

  platNext = Math.max(platNext, x0); trailNext = Math.max(trailNext, x0); batNext = Math.max(batNext, x0); decNext = Math.max(decNext, x0);
  const ramp = Math.min(0.04, x0 / 4000);                   // fica um pouco mais difícil com a distância
  for (let x = Math.max(x0, 10); x < x1 - 1; x++) {         // 1) espinhos e blocos em trechos planos
    if (!flat(x) || nearHole(x, 4)) continue;
    const q = rne();
    if (q < 0.05 + ramp && flat(x+1)) { for (const i of [0, 1]) spikes.push({x: (x+i)*T, y: (gy[x+i]-1)*T, kind: HAZ[bio[x+i]]}); x += 3; }
    else if (q < 0.1 + ramp * 2) { map[gy[x]-1][x] = 1; x += 2; }
  }
  const plats = [];                                          // 2) plataformas 3 tiles acima do chão
  for (; platNext < x1 - 6; platNext += 6 + Math.floor(rne() * 7)) {
    const x = platNext, w = 2 + Math.floor(rne() * 3);
    let hi = H; for (let i = 0; i < w; i++) hi = Math.min(hi, gy[x+i]);
    if (hi - 3 < 2) continue;
    for (let i = 0; i < w; i++) map[hi-3][x+i] = 2;      // 2 = plataforma: dá para atravessar por baixo
    plats.push({x, y: hi-3, w});
  }
  const coin = (x, y) => {                                   // 3) moedas
    if (y < 0 || map[y][x] || spikes.some(s => s.x === x*T && s.y === y*T)) return;
    coins.push({x: x*T+4, y: y*T+4, got: false});
  };
  for (const pl of plats) for (let i = 0; i < pl.w; i++) coin(pl.x + i, pl.y - 1);
  for (let x = x0; x < x1; x++) if (hole[x] && (x === x0 || !hole[x-1])) {      // arco de moedas sobre cada buraco
    let e = x; while (hole[e+1] && e + 1 < x1) e++;
    for (let i = x; i <= e; i++) coin(i, gy[i] - 3);
  }
  for (; trailNext < x1 - 4; trailNext += 9 + Math.floor(rne() * 5))
    for (let i = 0; i < 3; i++) if (!hole[trailNext+i]) coin(trailNext + i, gy[trailNext+i] - 1);

  // 4) Inimigos candidatos de 4 tipos. Cada um tem um sorteio (rank); a dificuldade deixa entrar só os de rank baixo.
  const cand = [];
  const ground = (x, lo, hi, rank) => {
    const u = rne(), type = u < 0.5 ? 'slime' : u < 0.75 ? 'frog' : 'golem';
    const S = {slime: {w: 12, h: 12, hp: 1, sp: 0.6}, frog: {w: 12, h: 10, hp: 1, sp: 0}, golem: {w: 14, h: 14, hp: 2, sp: 0.35}}[type];
    const y = gy[x]*T - S.h;
    cand.push({type, rank, ...S, x: x*T + 2, y, by: y, lo: lo*T + 1, hi: (hi+1)*T - S.w - 1,
               dir: rne() < 0.5 ? -1 : 1, vy: 0, sx: 0, alive: true, dead: 0, inv: 0, t: Math.floor(rank * 50)});
  };
  for (let x = Math.max(x0, 16); x < x1; x++) {              // terrestres: trechos planos longe de espinhos
    const ok = i => i >= x0 && i < x1 && !hole[i] && gy[i] === gy[x] && !map[gy[x]-1][i] && !spikes.some(s => s.x === i*T);
    if (rne() > 0.8 || !flat(x) || !ok(x) || nearHole(x, 2)) continue;
    let lo = x, hi = x;
    while (x - lo < 5 && ok(lo-1)) lo--;
    while (hi - x < 5 && ok(hi+1)) hi++;
    if (hi - lo < 4) continue;
    ground(x, lo, hi, rne());
    x += 3;
  }
  for (; batNext < x1 - 3; batNext += 4 + Math.floor(rne() * 4)) {   // morcegos: voam em ondas, longe de paredes e plataformas
    const x = batNext, rank = rne(), ph = rne() * 6.28;
    if (rne() > 0.7) continue;
    const g0 = Math.min(...gy.slice(x-2, x+3));
    let free = true;
    for (let ty = g0 - 5; ty <= g0 - 2; ty++) for (let tx = x-2; tx <= x+2; tx++) if (map[ty][tx]) free = false;
    if (!free) continue;
    cand.push({type: 'bat', rank, w: 12, h: 8, hp: 1, x: x*T, y: g0*T - 40, cx: x*T, by: g0*T - 40, dir: 1,
               alive: true, dead: 0, inv: 0, t: Math.floor(rank * 100), ph});
  }
  const base = DIFFS[level].keep, kp = base ? Math.min(1, base + Math.min(0.25, x0 / 2500)) : 0;
  for (const c of cand) if (c.rank < kp) enemies.push(c);

  for (; decNext < x1; decNext += 2 + Math.floor(rne() * 5)) {       // 5) enfeites do bioma
    const x = decNext;
    if (hole[x] || map[gy[x]-1][x] || spikes.some(s => s.x === x*T) || rne() > 0.75) continue;
    const kinds = [['tree', 'bush'], ['palm', 'rock'], ['pine', 'rock'], ['tree', 'bush']][bio[x]];
    decor.push({x: x*T + 8, y: gy[x]*T, kind: kinds[rne() < 0.6 ? 0 : 1], b: bio[x]});
  }
}

// Mantém o mundo gerado até a coluna col (e um pouco além).
function ensure(col) {
  while (terrX < col + 2*CH) { genTerrain(terrX, terrX + CH); terrX += CH; }
  while (entX + CH + 10 <= terrX) { genEntities(entX, entX + CH); entX += CH; }
}

// tile(): o que existe na posição (tx, ty): 0 vazio, 1 sólido, 2 plataforma. À esquerda = parede.
function tile(tx, ty) {
  if (tx < 0) return 1;
  if (ty < 0 || ty >= H) return 0;
  return map[ty][tx] || 0;
}
// Plataformas só seguram quem cai de cima: os pés estavam acima dela no quadro anterior.
function onPlatform(x, y, w, h, oldBottom) {
  const ty = Math.floor((y + h) / T);
  for (let tx = Math.floor(x/T); tx <= Math.floor((x+w-0.01)/T); tx++)
    if (tile(tx, ty) === 2 && oldBottom <= ty*T + 0.01) return true;
  return false;
}

const LB_KEY = 'plataforma2d-placar', NAME_KEY = 'plataforma2d-nome';
let board = [];
try { board = JSON.parse(localStorage.getItem(LB_KEY)) || []; if (!Array.isArray(board)) board = []; } catch (e) { board = []; }
try { best = Math.max(board.length ? board[0].s : 0, +localStorage.getItem('plataforma2d-recorde') || 0); } catch (e) {}
function saveBoard() { try { localStorage.setItem(LB_KEY, JSON.stringify(board)); } catch (e) {} }
function recordScore() {                         // guarda a partida no placar (acontece uma vez por partida)
  if (!runActive) return;
  runActive = false;
  const sc = score(); newBest = sc > best; lastRank = -1;
  if (sc <= 0) return;
  const entry = {s: sc, n: playerName, d: level, dt: Date.now(), m: dist};
  board.push(entry); board.sort((a, b) => b.s - a.s); board = board.slice(0, 10);
  lastRank = board.indexOf(entry); saveBoard();
  best = Math.max(best, sc);
}

function resetPlayer() {
  p.x = 2*T + 3; p.y = gy[2]*T - p.h; p.vx = 0; p.vy = 0; p.ground = false;
  coyote = buf = atk = 0; pInv = 0; camX = panX = 0;
}
function start(seed) {                           // novo mundo: a semente é sorteada a cada partida (não aparece mais para o jogador)
  recordScore();                                  // se a partida anterior foi abandonada, ela entra no placar
  newWorld(seed ? seed : String(100000 + Math.floor(Math.random() * 900000)), diff);
  lives = 3; bonus = 0; dist = 0; newBest = false; lastRank = -1; state = 'play'; paused = false; runActive = true;
  pw.dj = pw.star = pw.speed = 0; airJumps = 0;

    for (let x = 0; x < row.length;) {
      const ch = row[x]; let n = 1;
      while (x + n < row.length && row[x + n] === ch) n++;

  const d = PU[it.t]; sfx.power();

  else pw[it.t] = d.dur;

}
function moveEnemy(e) {
  e.t++; if (e.inv > 0) e.inv--;
  if (e.type === 'bat') {                          // morcego: voa em ondas e ignora o chão
    const a = e.t / 40 + e.ph;
    e.x = e.cx + Math.sin(a) * 30; e.y = e.by + Math.sin(e.t / 17 + e.ph) * 12; e.dir = Math.cos(a) >= 0 ? 1 : -1;
  } else if (e.type === 'frog') {                  // sapo: espera parado e salta na direção em que olha
    if (e.y >= e.by && e.vy >= 0) {
      e.y = e.by; e.vy = 0; e.sx = 0;
      if (e.t > 55) { e.t = 0; e.vy = -4.6; e.sx = e.dir * 1.3; }
    } else {
      e.vy += 0.35; e.y += e.vy; e.x += e.sx;
      if (e.y >= e.by) { e.y = e.by; e.vy = 0; e.sx = 0; e.t = 0; }
    }
    if (e.x < e.lo) { e.x = e.lo; e.dir = 1; e.sx = Math.abs(e.sx); }
    else if (e.x > e.hi) { e.x = e.hi; e.dir = -1; e.sx = -Math.abs(e.sx); }
  } else {                                         // lesma e golem: patrulham o trecho
    e.x += e.dir * e.sp;
    if (e.x < e.lo) { e.x = e.lo; e.dir = 1; } else if (e.x > e.hi) { e.x = e.hi; e.dir = -1; }
  }
}

// ---------- ATUALIZAÇÃO (60x por segundo) ----------
function update() {
  if (state === 'menu') { panX += 0.45; ensure(Math.floor(panX / T) + 40); return; }
  if (state !== 'play') return;
  music();
  if (pInv > 0) pInv--;
  for (const k in pw) if (pw[k] > 0) pw[k]--;

  // 1) Movimento horizontal: aceleração + atrito (na neve o chão é escorregadio)
  const ice = bio[Math.floor((p.x + p.w/2) / T)] === 2;
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  const fast = pw.speed > 0, vmax = fast ? 2.9 : MAX;               // super velocidade
  p.vx += dir * (ice ? 0.12 : ACC) * (fast ? 1.6 : 1);
  if (dir === 0) p.vx *= ice ? 0.97 : 0.8;
  p.vx = Math.max(-vmax, Math.min(vmax, p.vx));
  if (Math.abs(p.vx) < 0.05) p.vx = 0;
  if (dir) facing = dir;

  // 2) Pulo, com "coyote time" e buffer
  if (keys.j && !prevJ) buf = 6;
  prevJ = keys.j;
  if (p.ground) { coyote = 6; airJumps = 1; } else if (coyote > 0) coyote--;
  if (buf > 0) buf--;

  else if (buf > 0 && pw.dj > 0 && airJumps > 0 && !p.ground) { p.vy = JUMP * 0.95; airJumps--; buf = 0; sfx.jump2(); }   // pulo duplo
  if (!keys.j && p.vy < -2) p.vy = -2;           // soltar o botão = pulo mais baixo

  // 3) Gravidade
  p.vy = Math.min(p.vy + GRAV, 8);

  // 4) Mover um eixo por vez e corrigir a colisão
  p.x += p.vx;
  if (hitsSolid(p.x, p.y, p.w, p.h)) {
    if (p.vx > 0) p.x = Math.floor((p.x + p.w) / T) * T - p.w;
    else          p.x = (Math.floor(p.x / T) + 1) * T;
    p.vx = 0;
  }
  const oldBottom = p.y + p.h;
  p.y += p.vy;
  p.ground = false;
  if (hitsSolid(p.x, p.y, p.w, p.h)) {
    if (p.vy > 0) { p.y = Math.floor((p.y + p.h) / T) * T - p.h; p.ground = true; }

  }

  if (col - 2 > dist) dist = col - 2;

  // 6) Espada e inimigos: o golpe só machuca no meio da animação
  if (keys.a && !prevA && atk === 0) { atk = ATK; sfx.swing(); }
  prevA = keys.a;
  if (atk > 0) {
    atk--;

    }
  }
  for (const e of enemies) { if (e.alive) moveEnemy(e); else if (e.dead > 0) e.dead--; }
  for (const it of items) {                       // power-ups caem, esperam um tempo e piscam antes de sumir
    it.life--; it.vy = Math.min(it.vy + 0.3, 6);
    const oldB = it.y + 10; it.y += it.vy;
    if (it.vy > 0 && (hitsSolid(it.x, it.y, 10, 10) || onPlatform(it.x, it.y, 10, 10, oldB))) {

  }
  items = items.filter(it => it.life > 0 && it.y < H*T + 20);

  // 7) Perigos e moedas (depois de renascer, 2 segundos de invencibilidade; cair no buraco sempre custa uma vida)
